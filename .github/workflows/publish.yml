name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Resolve the SDK from global.json so CI cannot drift from it.
          # 'dotnet-version: 8.0.x' resolved to the 8.0.4xx band, which global.json
          # (8.0.200 / latestPatch) rejects, so builds silently relied on the runner
          # image happening to preinstall an 8.0.2xx SDK.
          global-json-file: global.json

      - name: Validate version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
          echo "Tag version: $TAG_VERSION"
          echo "Directory.Build.props version: $PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match Directory.Build.props version ($PROPS_VERSION)"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --verbosity normal

      - name: Pack
        # Solution-level pack produces all five packages; test projects opt out
        # via IsPackable=false.
        run: dotnet pack ezDDD.sln -c Release --no-restore -o ./nupkg

      - name: Verify package count
        run: |
          COUNT=$(ls ./nupkg/*.nupkg | wc -l)
          echo "Packed $COUNT packages"
          if [ "$COUNT" != "5" ]; then
            echo "::error::Expected 5 packages (Common, Entity, UseCase, Cqrs, Core), got $COUNT"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./nupkg/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment: nuget

    permissions:
      contents: write   # gh release upload
      id-token: write   # OIDC token for NuGet Trusted Publishing

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: ./nupkg/

      # Trusted Publishing: exchange a short-lived GitHub OIDC token for a
      # 1-hour NuGet API key. Runs immediately before the push so the key does
      # not expire. No long-lived NUGET_API_KEY secret is stored.
      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" ./nupkg/*.nupkg --clobber
